# Pile de production : Caddy (HTTPS) -> nginx (frontend) -> Spring Boot (backend).
# Lancement depuis le dossier deploy/ :
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Seul Caddy est exposé ; frontend et backend ne sont joignables que sur le réseau interne.

name: invoice-pdf

x-commun: &commun
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    <<: *commun
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN manquant}
      ACCES: ${ACCES:-restreint}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./acces:/etc/caddy/acces:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128m

  frontend:
    <<: *commun
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE manquant}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64m

  backend:
    <<: *commun
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE manquant}
    # Seules les variables utiles au backend lui sont transmises (pas l'empreinte du mot de passe).
    environment:
      SPRING_PROFILES_ACTIVE: prod
      INVOICE_CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN}
      INVOICE_SWAGGER_UI_ENABLED: "false"
      INVOICE_RATE_LIMIT_PER_MINUTE: ${INVOICE_RATE_LIMIT_PER_MINUTE:-30}
      INVOICE_ISSUER_NAME: ${INVOICE_ISSUER_NAME:-}
      INVOICE_ISSUER_ADDRESS_LINE1: ${INVOICE_ISSUER_ADDRESS_LINE1:-}
      INVOICE_ISSUER_ADDRESS_LINE2: ${INVOICE_ISSUER_ADDRESS_LINE2:-}
      INVOICE_ISSUER_POSTAL_CODE: ${INVOICE_ISSUER_POSTAL_CODE:-}
      INVOICE_ISSUER_CITY: ${INVOICE_ISSUER_CITY:-}
      INVOICE_ISSUER_SIRET: ${INVOICE_ISSUER_SIRET:-}
      INVOICE_ISSUER_EMAIL: ${INVOICE_ISSUER_EMAIL:-}
      INVOICE_ISSUER_PHONE: ${INVOICE_ISSUER_PHONE:-}
      INVOICE_ISSUER_IBAN: ${INVOICE_ISSUER_IBAN:-}
      INVOICE_SITE_EDITOR_NAME: ${INVOICE_SITE_EDITOR_NAME:-}
      INVOICE_SITE_EDITOR_ADDRESS: ${INVOICE_SITE_EDITOR_ADDRESS:-}
      INVOICE_SITE_EDITOR_EMAIL: ${INVOICE_SITE_EDITOR_EMAIL:-}
      INVOICE_SITE_PUBLICATION_DIRECTOR: ${INVOICE_SITE_PUBLICATION_DIRECTOR:-}
      INVOICE_SITE_HOST_NAME: ${INVOICE_SITE_HOST_NAME:-}
      INVOICE_SITE_HOST_ADDRESS: ${INVOICE_SITE_HOST_ADDRESS:-}
      INVOICE_SITE_HOST_CONTACT: ${INVOICE_SITE_HOST_CONTACT:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  caddy_data:
  caddy_config:
