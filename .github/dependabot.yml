version: 2
# Toutes les mises à jour arrivent sur dev, jamais directement sur main.
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # Versions majeures bloquées tant que le projet ne peut pas les suivre :
    # ESLint 10 n'est pas encore supporté par eslint-plugin-jsx-a11y ; les types de Node suivent
    # la version de Node utilisée (24) ; jsdom 30 et plus exige une version de Node plus récente.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      # TypeScript 7 : pas encore supporté par typescript-eslint.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /frontend
    target-branch: dev
    schedule:
      interval: monthly
    # Les images suivent les versions utilisées et testées en CI (Java 21, Node 24).
    # Un changement de version majeure se décide et se teste à part, pas par Dependabot.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
