name: Publication

# Publie les images Docker sur ghcr.io quand une étiquette de version (v1.0.0) est poussée.
# L'étiquette doit désigner un commit de main : main n'accepte que du code passé par la CI.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    name: Étiquette sur main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Le commit étiqueté appartient à main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "L'étiquette ${GITHUB_REF_NAME} ne désigne pas un commit de main : publication refusée."
            exit 1
          fi

  images:
    name: Image ${{ matrix.composant }}
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        composant: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # ghcr.io exige des noms en minuscules (le compte s'écrit avec des majuscules).
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/invoice-pdf-${{ matrix.composant }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # 1.0.0 et 1.0 ; jamais "latest" : la production désigne toujours une version précise.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=invoice-pdf-${{ matrix.composant }}
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.composant }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Condensat à reporter dans .env.prod
        run: |
          echo "### invoice-pdf-${{ matrix.composant }} ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
