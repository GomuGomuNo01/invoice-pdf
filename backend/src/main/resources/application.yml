spring:
  application:
    name: invoice-pdf
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  thymeleaf:
    cache: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  # Derrière nginx (et Caddy en production), l'adresse du client vient de X-Forwarded-For.
  # Tomcat ne lit cet en-tête que si la requête arrive d'un proxy interne (adresses privées et
  # boucle locale, valeur par défaut de server.tomcat.remoteip.internal-proxies) : un client
  # externe ne peut donc pas usurper une adresse pour contourner la limitation de débit.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-swallow-size: 1MB

invoice:
  issuer:
    name: "${INVOICE_ISSUER_NAME:}"
    address-line1: "${INVOICE_ISSUER_ADDRESS_LINE1:}"
    address-line2: "${INVOICE_ISSUER_ADDRESS_LINE2:}"
    postal-code: "${INVOICE_ISSUER_POSTAL_CODE:}"
    city: "${INVOICE_ISSUER_CITY:}"
    siret: "${INVOICE_ISSUER_SIRET:}"
    email: "${INVOICE_ISSUER_EMAIL:}"
    phone: "${INVOICE_ISSUER_PHONE:}"
    iban: "${INVOICE_ISSUER_IBAN:}"
  # Mentions légales du site (éditeur et hébergeur), renseignées en production.
  site:
    editor-name: "${INVOICE_SITE_EDITOR_NAME:}"
    editor-address: "${INVOICE_SITE_EDITOR_ADDRESS:}"
    editor-email: "${INVOICE_SITE_EDITOR_EMAIL:}"
    publication-director: "${INVOICE_SITE_PUBLICATION_DIRECTOR:}"
    host-name: "${INVOICE_SITE_HOST_NAME:}"
    host-address: "${INVOICE_SITE_HOST_ADDRESS:}"
    host-contact: "${INVOICE_SITE_HOST_CONTACT:}"
  api:
    cors-allowed-origins: "${INVOICE_CORS_ALLOWED_ORIGINS:http://localhost:5173}"
    max-request-bytes: 262144
    rate-limit-per-minute: ${INVOICE_RATE_LIMIT_PER_MINUTE:30}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/docs
    enabled: ${INVOICE_SWAGGER_UI_ENABLED:true}

logging:
  level:
    root: INFO
