# Démarrage conteneurisé local : http://localhost:8081
# Prérequis : fichier .env à la racine (copie de .env.example).
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      INVOICE_CORS_ALLOWED_ORIGINS: http://localhost:8081
      INVOICE_SWAGGER_UI_ENABLED: "false"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:8080"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
