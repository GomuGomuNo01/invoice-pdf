# Description du service pour Render (Blueprint) : un seul conteneur, offre gratuite.
# Création : tableau de bord Render > New > Blueprint > ce dépôt. Voir le guide de mise en ligne.
# Render déploie automatiquement chaque nouveau commit de main (qui n'accepte que du code passé par la CI).
services:
  - type: web
    name: invoice-pdf
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # 512 Mo de mémoire sur l'offre gratuite : deux rendus PDF simultanés au maximum.
      - key: INVOICE_API_MAX_CONCURRENT_RENDERS
        value: "2"
      - key: INVOICE_RATE_LIMIT_PER_MINUTE
        value: "30"
      # Adresse réelle du client : Render passe par Cloudflare, qui refuse (403) toute requête fournissant
      # elle-même CF-Connecting-IP ; cet en-tête porte donc toujours l'adresse vraie du visiteur.
      # Vérifié en ligne le 27/11/2026 : X-Forwarded-For, True-Client-IP ou X-Real-IP inventés ne
      # contournent pas la limite (scripts/verifier-en-ligne.sh --limite).
      - key: INVOICE_API_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # Anti-veille : l'application appelle sa santé publique toutes les 10 minutes (l'offre gratuite
      # s'endort après 15 minutes sans visite). La surveillance GitHub réveille le service s'il dort quand même.
      - key: INVOICE_KEEP_AWAKE_URL
        value: https://invoice-pdf-hxrd.onrender.com/actuator/health
      # Mentions légales du site, à saisir dans le tableau de bord (non versionnées).
      - key: INVOICE_SITE_EDITOR_NAME
        sync: false
      - key: INVOICE_SITE_EDITOR_ADDRESS
        sync: false
      - key: INVOICE_SITE_EDITOR_EMAIL
        sync: false
      - key: INVOICE_SITE_PUBLICATION_DIRECTOR
        sync: false
      - key: INVOICE_SITE_HOST_NAME
        sync: false
      - key: INVOICE_SITE_HOST_ADDRESS
        sync: false
      - key: INVOICE_SITE_HOST_CONTACT
        sync: false
